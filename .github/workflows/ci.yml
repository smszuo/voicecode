name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]  # attach the AppImage to every new release
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the AppImage to (e.g. v0.1.0); empty = build only"
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Tests need no GTK, display, mic, or API key: they use a fake local WebSocket server.
      - run: uv venv --python ${{ matrix.python }} .venv
      - run: uv pip install --python .venv/bin/python -e .
      - run: .venv/bin/python tests/test_voicecode.py

  build-appimage:
    needs: test
    # 22.04 ships Python 3.10 as /usr/bin/python3, the same Python the AppImage runs with.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}  # build the tagged code when attaching to a release
      - uses: astral-sh/setup-uv@v5
      # appimagetool refuses to run without desktop-file-validate.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends desktop-file-utils
      # `sh` so it works even if git stored the script without the executable bit.
      - run: sh scripts/build-appimage.sh
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"  # run appimagetool without FUSE on the runner
      - uses: actions/upload-artifact@v4
        with:
          name: voicecode-appimage
          path: dist/voicecode-*-x86_64.AppImage  # the versioned file, not the stable symlink
          if-no-files-found: error

  release-appimage:
    needs: build-appimage
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # upload release files; only this job gets write access
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: voicecode-appimage
          path: dist
      # The file name carries the pyproject.toml version, so a tag/version mismatch fails here.
      - run: gh release upload "$TAG" "dist/voicecode-${TAG#v}-x86_64.AppImage" --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
