name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Tests need no GTK, display, mic, or API key: they use a fake local WebSocket server.
      - run: uv venv --python ${{ matrix.python }} .venv
      - run: uv pip install --python .venv/bin/python -e .
      - run: .venv/bin/python tests/test_voicecode.py

  build-appimage:
    needs: test
    # 22.04 ships Python 3.10 as /usr/bin/python3, the same Python the AppImage runs with.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # appimagetool refuses to run without desktop-file-validate.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends desktop-file-utils
      # `sh` so it works even if git stored the script without the executable bit.
      - run: sh scripts/build-appimage.sh
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"  # run appimagetool without FUSE on the runner
      - uses: actions/upload-artifact@v4
        with:
          name: voicecode-appimage
          path: dist/voicecode-*-x86_64.AppImage  # the versioned file, not the stable symlink
          if-no-files-found: error

  # ---- Tauri desktop app (desktop/) ----

  desktop-test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev libx11-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # Tests need no display, mic, or API key: they use a fake local WebSocket server.
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo fmt --check

  desktop-build:
    needs: desktop-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev libx11-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Prebuilt Tauri CLI from npm: much faster than `cargo install tauri-cli`.
      - run: npx --yes @tauri-apps/cli@2 build -- --locked
        working-directory: desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: voicecode-desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
