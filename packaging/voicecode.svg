<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5dfc"/>
      <stop offset="1" stop-color="#1590e0"/><!-- dark enough for 3:1 against the white glyphs -->
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- tile: shadow, gradient, top highlight -->
  <rect x="20" y="26" width="216" height="216" rx="52" fill="#1b1464" opacity="0.30" filter="url(#shadow)"/>
  <rect x="20" y="16" width="216" height="216" rx="52" fill="url(#bg)"/>
  <rect x="20" y="16" width="216" height="108" rx="52" fill="url(#gloss)"/>

  <!-- code brackets -->
  <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M72 98 L48 124 L72 150"/>
    <path d="M184 98 L208 124 L184 150"/>
  </g>

  <!-- microphone -->
  <rect x="106" y="56" width="44" height="82" rx="22" fill="#ffffff"/>
  <g stroke="#6d5dfc" stroke-width="5" stroke-linecap="round" opacity="0.45">
    <path d="M118 84 H138"/>
    <path d="M118 98 H138"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round">
    <path d="M88 118 a40 40 0 0 0 80 0"/>
    <path d="M128 160 V184"/>
    <path d="M106 190 H150"/>
  </g>
</svg>
