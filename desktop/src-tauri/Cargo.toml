[package]
name = "voicecode"
version = "0.1.0"
edition = "2024"
description = "Push-to-talk dictation into any app"

[lib]
name = "voicecode_lib"
crate-type = ["rlib"]

[dependencies]
cpal = "0.18.2"
device_query = "4.0.1"
dirs = "7.0.0"
enigo = "0.6.1"
futures-util = "0.3.34"
log = "0.4.35"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-log = "2.10.2"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
url = "2.5.8"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
