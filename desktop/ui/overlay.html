<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>voicecode</title>
<style>
  html, body { margin: 0; height: 100%; background: #1e1e1e; overflow: hidden; }
  body {
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 10px 16px; box-sizing: border-box;
    font: 18px/1.35 system-ui, -apple-system, "Segoe UI", Ubuntu, sans-serif;
    border-top: 3px solid #6d5dfc;
  }
  /* Keep the newest words visible: older lines scroll off the top. */
  #text { overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  #final { color: #fff; }
  #partial { color: #a8a8a8; }
  #final.error { color: #ff8a8a; }
  body.error { border-top-color: #ff6b6b; }
</style>
</head>
<body>
<div id="text" aria-live="polite">
  <div id="final"></div>
  <div id="partial">Listening…</div>
</div>
<script>
  const finalEl = document.getElementById("final");
  const partialEl = document.getElementById("partial");
  window.__TAURI__.event.listen("overlay", ({ payload: { kind, text } }) => {
    const isError = kind === "error";
    document.body.classList.toggle("error", isError);
    finalEl.classList.toggle("error", isError);
    if (kind === "start") {
      finalEl.textContent = "";
      partialEl.textContent = "Listening…";
    } else if (kind === "partial") {
      partialEl.textContent = text;
    } else if (kind === "final") {
      finalEl.textContent = (finalEl.textContent + " " + text).trim();
      partialEl.textContent = "";
    } else if (isError) {
      finalEl.textContent = text;
      partialEl.textContent = "";
    }
  });
</script>
</body>
</html>
