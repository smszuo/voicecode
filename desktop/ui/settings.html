<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>voicecode settings</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f1f24; --muted: #5d5d66; --border: #c9c9d1;
    --accent: #5546e8; --error: #b3261e; --ok: #1d7a3a; --field: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e22; --fg: #ececf1; --muted: #a9a9b3; --border: #4a4a55;
      --accent: #9d93ff; --error: #ff8a80; --ok: #7bd88f; --field: #2a2a30;
      color-scheme: dark;
    }
  }
  body {
    margin: 0; padding: 20px 24px; background: var(--bg); color: var(--fg);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Ubuntu, sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 16px; }
  label { display: block; font-weight: 600; margin: 16px 0 4px; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 4px 0 0; }
  input, textarea {
    width: 100%; box-sizing: border-box; padding: 8px 10px; font: inherit;
    color: var(--fg); background: var(--field); border: 1px solid var(--border); border-radius: 6px;
  }
  textarea { height: 170px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 20px; flex-wrap: wrap; }
  button {
    font: inherit; padding: 8px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--fg);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { button.primary { color: #16161a; } }
  #status { margin-left: 4px; }
  #status.error { color: var(--error); }
  #status.ok { color: var(--ok); }
  footer { margin-top: 20px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>voicecode settings</h1>
<form id="form" novalidate>
  <label for="endpoint">WebSocket endpoint</label>
  <input id="endpoint" type="url" placeholder="wss://host/path" spellcheck="false" autocomplete="off"
         aria-describedby="endpoint-hint">
  <p class="hint" id="endpoint-hint"></p>

  <label for="vocabulary">Vocabulary</label>
  <textarea id="vocabulary" spellcheck="false" aria-describedby="vocab-hint"></textarea>
  <p class="hint" id="vocab-hint">One word or phrase per line, e.g. <code>kubectl</code>. Lines starting with # are ignored.
    Used from the next push-to-talk press.</p>

  <div class="row">
    <button type="submit" class="primary">Save</button>
    <button type="button" id="reset">Use default endpoint</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>
</form>
<footer id="version"></footer>
<script>
  const { invoke } = window.__TAURI__.core;
  const $ = (id) => document.getElementById(id);
  const status = (text, kind) => { $("status").textContent = text; $("status").className = kind || ""; };

  async function load() {
    const s = await invoke("get_settings");
    $("endpoint").value = s.endpoint;
    $("vocabulary").value = s.vocabulary;
    $("endpoint-hint").textContent =
      `wss:// only (ws:// is allowed for localhost). Leave empty to use $${s.endpoint_env_name}` +
      (s.env_endpoint ? ` (${s.env_endpoint}).` : ", which is not set.");
    $("version").textContent = `voicecode ${s.version}`;
  }

  async function save() {
    try {
      await invoke("save_settings", { endpoint: $("endpoint").value, vocabulary: $("vocabulary").value });
      status("Saved.", "ok");
    } catch (e) {
      status(String(e), "error");
      $("endpoint").focus();
    }
  }

  $("form").addEventListener("submit", (e) => { e.preventDefault(); save(); });
  $("reset").addEventListener("click", () => { $("endpoint").value = ""; save(); });
  load().catch((e) => status(String(e), "error"));
</script>
</body>
</html>
